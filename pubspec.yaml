name: flutterqrscan
description: Flutter QR & Barcode Scanner with encrypted offline scan history.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.0

  # Modern QR & Barcode Camera Scanner (Google ML Kit based)
  mobile_scanner: ^7.0.0

  # QR Code generation
  qr_flutter: ^4.1.0

  # Local database (Drift ORM)
  drift: ^2.12.0
  path_provider: ^2.1.1
  path: ^1.8.3
  uuid: ^4.2.2

  # Encrypted SQLite (SQLCipher). Do NOT add sqlite3_flutter_libs together with this.
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.1.0

  # Secure storage for the database encryption key (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.12.0
  build_runner: ^2.4.6


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
